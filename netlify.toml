# HIRAKU を Netlify で公開するための設定
#
# 保存されるもの: すべて利用者のブラウザの中（localStorage）です。
#   サーバーは何も保存しません。物件の住所などがサーバーに残ることはありません。
#
# 環境変数（Netlify の Site settings → Environment variables）:
#   ANTHROPIC_API_KEY   実際のAIに繋ぐ場合のみ。未設定ならモックで全機能が動きます
#   LLM_MODE=live       上のキーとセットで指定したときだけ実AIになります
#   ※ 公開サイトで live にすると、訪問者の操作でAPI利用料が発生します。
#     簡易のレート制限は入れていますが、まずは未設定（モック）での公開を推奨します。

[build]
  command = "pnpm install --dangerously-allow-all-builds && pnpm --filter web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
